[project]
name = "data-generator"
version = "0.1.0"
description = "Synthetic restaurant-marketplace data generator for the dbt x Elementary demo"
requires-python = ">=3.13"
dependencies = [
    "faker>=37.0.0",
    "snowflake-connector-python>=3.12.0",
]

[project.scripts]
generator_history = "data_generator.entrypoints.history:main"
generator_new_day = "data_generator.entrypoints.new_day:main"
generator_status = "data_generator.entrypoints.status:main"
generator_reset = "data_generator.entrypoints.reset:main"
generator_create_chaos = "data_generator.entrypoints.create_chaos:main"
generator_chaos_drop_column = "data_generator.entrypoints.chaos.drop_column:main"
generator_chaos_duplicate_menu_item = "data_generator.entrypoints.chaos.duplicate_menu_item:main"
generator_chaos_orphan_menu_item = "data_generator.entrypoints.chaos.orphan_menu_item:main"
generator_chaos_new_restaurant_volume = "data_generator.entrypoints.chaos.new_restaurant_volume:main"
generator_chaos_late_restaurant = "data_generator.entrypoints.chaos.late_restaurant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/data_generator"]
